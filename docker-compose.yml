services:
  base_datos:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: sivad
      POSTGRES_USER: sivad
      POSTGRES_PASSWORD: sivad_desarrollo
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sivad -d sivad"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DEPURACION: "True"
      SECRETO_DJANGO: desarrollo-no-usar-en-produccion
      HOSTS_PERMITIDOS: localhost,127.0.0.1
      URL_BD: postgis://sivad:sivad_desarrollo@base_datos:5432/sivad
    ports:
      - "8000:8000"
    depends_on:
      base_datos:
        condition: service_healthy
    volumes:
      - ./backend:/aplicacion

volumes:
  datos_postgres:
